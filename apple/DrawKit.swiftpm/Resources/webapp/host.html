<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DrawKit</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #f1f3f4; }
	iframe { border: 0; width: 100%; height: 100%; display: block; }
	@media (prefers-color-scheme: dark) { html, body { background: #1e1e1e; } }
</style>
</head>
<body>
<iframe id="editor" src="editor.html?embed=1&proto=json&spin=1&stealth=1&modified=0&noExitBtn=1&noSaveBtn=1&saveAndExit=0"></iframe>
<script>
/**
 * Hosts the draw.io editor in embed mode and connects it to the native app.
 *
 * Native side (WKWebView) provides window.webkit.messageHandlers.drawkit,
 * whose postMessage({name, params}) returns a Promise with the reply:
 * - getDocument -> xml string
 * - saveDocument {xml}
 * - flowEvent {type, ...}
 * - notify, copy, paste, runShortcut, openURL, http (see flow.js)
 */
(function()
{
	var frame = document.getElementById('editor');
	var pendingRun = null;

	function bridge()
	{
		return (window.webkit != null && window.webkit.messageHandlers != null) ?
			window.webkit.messageHandlers.drawkit : null;
	}

	function native(name, params)
	{
		var b = bridge();

		if (b == null)
		{
			return Promise.reject(new Error('Native feature "' + name + '" is only available in the app'));
		}

		return b.postMessage({name: name, params: params || {}});
	}

	function send(msg)
	{
		frame.contentWindow.postMessage(JSON.stringify(msg), '*');
	}

	window.DrawKitHost = {
		native: native,
		plugin: null,
		onPluginReady: function(plugin)
		{
			this.plugin = plugin;

			if (pendingRun != null)
			{
				var fn = pendingRun;
				pendingRun = null;
				fn();
			}
		},
		onFlowEvent: function(type, data)
		{
			data.type = type;
			native('flowEvent', data).catch(function() {});
		},
		// Called by the app's toolbar
		run: function()
		{
			var self = this;
			var go = function() { self.plugin.run().catch(function() {}); };
			(this.plugin != null) ? go() : pendingRun = go;
		},
		stop: function()
		{
			if (this.plugin != null)
			{
				this.plugin.stop();
			}
		},
		editAction: function()
		{
			if (this.plugin != null)
			{
				this.plugin.editAction();
			}
		}
	};

	window.addEventListener('message', function(evt)
	{
		if (evt.source != frame.contentWindow || typeof evt.data !== 'string' || evt.data.length == 0)
		{
			return;
		}

		var msg;

		try
		{
			msg = JSON.parse(evt.data);
		}
		catch (e)
		{
			return;
		}

		if (msg.event == 'init')
		{
			native('getDocument').then(function(xml)
			{
				send({action: 'load', xml: xml || '', autosave: 1, title: ''});
			}).catch(function()
			{
				// Browser preview without the app
				send({action: 'load', xml: '', autosave: 1});
			});
		}
		else if ((msg.event == 'autosave' || msg.event == 'save') && msg.xml != null)
		{
			native('saveDocument', {xml: msg.xml}).catch(function() {});
		}
	});
})();
</script>
</body>
</html>
